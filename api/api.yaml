openapi: 3.0.0
info:
  title: Файловый менеджер локальных файлов
  version: 1.0.0
paths:
  /api/admin/login:
    post:
      description: >-
        Авторизацию пользователя
      tags:
        - admin
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                login:
                  $ref: '#/components/schemas/login'
                password:
                  $ref: '#/components/schemas/password'
      responses:
        '200':
          description: Пользователь успешно авторизован
          content:
            application/json:
              schema:
                $ref: ''
components:
  responses:
    '400':
      description: Невалидные данные ввода
    '401':
      description: Неавторизованный доступ
    '5xx':
      description: Ошибка сервера
      headers:
        Retry-After:
          description: Время, через которое еще раз нужно сделать запрос
          required: false
          schema:
            type: integer
  schemas:
    login:
      type: string
      description: Логин пользователя
      example: user1
    password:
      type: string
      description: Пароль пользователя
      example: password
